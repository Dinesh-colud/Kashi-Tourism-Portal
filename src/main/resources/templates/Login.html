<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styleLogin.css">
    <link rel="icon" type="image/png" href="kashi.png">
</head>
<body>

<div class="card">
    <div class="card-header">
        <h2>Welcome back</h2>
        <p class="dinesh" style="color: black;">Please enter your details to sign in.</p>
    </div>

    <form th:action="@{/loginForm}" th:object="${user}" method="POST" class="register-form">

        <div class="form-group">
            <label for="email" style="color: black;">Email Address</label>
            <div class="input-wrapper">
                <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
                <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" required>
            </div>
        </div>

        <div class="form-group">
            <div class="password-header">
                <label for="password" style="color: black;">Password</label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <div class="input-wrapper">
                <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required>
            </div>
        </div>

        <button type="submit" class="submit-btn">Log in</button>
    </form>

    <div class="card-footer">
        <p>Don't have an account? <a th:href="@{/registerForm}">Sign up</a></p>
    </div>
</div>

</body>
</html>
