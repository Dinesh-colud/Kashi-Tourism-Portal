<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styleReg.css">
    <link rel="icon" type="image/png" href="kashi.png">
</head>
<body>

<div class="card">
    <div class="card-header">
        <h2>Create an account</h2>
        <p>Begin your journey in the spirit of Kashi.</p>

        <div th:if="${success}" class="message success-msg">
            <p th:text="${success}"></p>
        </div>

        <div th:if="${error}" class="message error-msg">
            <p th:text="${error}"></p>
        </div>

    </div>

    <form th:action="@{/regForm}" th:object="${user}" method="POST" class="register-form">

        <div class="form-group">
            <label for="name">Full Name</label>
            <div class="input-wrapper">
                <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <input type="text" id="name" th:field="*{name}" placeholder="John Doe" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
                <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
                </svg>
                <input type="email" id="email" th:field="*{email}" placeholder="you@example.com" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">New Password</label>
            <div class="input-wrapper">
                <svg class="input-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <input type="password" id="password" th:field="*{password}" placeholder="••••••••" required>
            </div>
        </div>

        <div class="form-group">
            <label for="city">City</label>
            <select id="city" th:field="*{city}" required>
                <option value="" disabled selected>Select your city</option>
                <option value="Varanasi">Varanasi</option>
                <option value="Pune">Pune</option>
                <option value="Noida">Noida</option>
                <option value="Surat">Surat</option>
                <option value="Mumbai">Mumbai</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <span class="label-text">Gender</span>
            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" th:field="*{gender}" value="male" required>
                    <span>Male</span>
                </label>
                <label class="radio-label">
                    <input type="radio" th:field="*{gender}" value="female">
                    <span>Female</span>
                </label>
                <label class="radio-label">
                    <input type="radio" th:field="*{gender}" value="other">
                    <span>Other</span>
                </label>
            </div>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>
    </form>

    <div class="card-footer">
        <p>Already have an account? <a th:href="@{/loginForm}">Log in</a></p>
    </div>
</div>

</body>
</html>
